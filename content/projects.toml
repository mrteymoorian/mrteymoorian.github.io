[[items]]
id = "huddle"
short = "HUDDLE"
title = "Visual Grounding and Deliberation Help Multi-Robot Teams Make High-Stakes Decisions"
venue = "Under review"
year = 2026
tags = ["Embodied AI", "Multi-agent", "VLMs", "Safety"]
summary = "A benchmark and a structured deliberation protocol for teams of VLM-driven robots that must jointly decide whether an action is safe when the evidence is split across robots. Collaboration with Qualcomm."

stats = [
  { value = "3 × 12", label = "environments × balanced instances" },
  { value = "5", label = "frontier VLMs evaluated" },
  { value = "+42 pp", label = "largest accuracy gain from HUDDLE" },
  { value = "96%", label = "best team accuracy" },
]

figures = [
  { src = "/projects/huddle-benchmark.webp", width = 912, height = 567, caption = "The three environments. Each robot holds a camera view and possibly a private fact; the evidence chain on the right must be assembled across robots to reach HOLD. In the bedroom, the chain also requires sequential camera moves." },
  { src = "/projects/huddle-protocol.webp", width = 1095, height = 564, wide = true, caption = "The HUDDLE protocol: two pooling stages, two processing stages and an optional Challenge safeguard. When robots can act, planned moves are announced and reviewed before execution." },
  { src = "/projects/huddle-traces.webp", width = 1212, height = 654, wide = true, caption = "Representative traces. Open Deliberation fails when evidence is kept private, dismissed or acted on too early; HUDDLE surfaces the same evidence in its Grounding, Share and Assess stages." },
  { src = "/projects/huddle-results.webp", width = 1092, height = 669, wide = true, caption = "(a) Decision accuracy for five models in three environments. (b) Pooling and processing failure rates, Open Deliberation → HUDDLE with safeguard." },
]

content = '''
### The problem

As VLM-powered generalist robots move into homes, several robots will often share a task while each sees only part of the scene. We study the hardest version of that setting: a routine instruction hides a latent hazard, no single robot can see enough to catch it, and the team has to decide together whether to **PROCEED** or **HOLD**. We model this as a finite-horizon Dec-POMDP with explicit communication. Each round, every robot receives its camera image, any private context and the messages from the previous round; it may post a message, move its camera (in the bedroom) and vote. The team decision is the majority of the latest votes.

### Benchmark

Three household environments, 12 balanced instances each:

- **Kitchen**: serve a sandwich. Hazard: spoilage or an allergy. The hazard rule is stated explicitly and all evidence is available from the start; it only has to be pooled in the right order.
- **Living room**: move a table into a children's room. Hazard: a sharp or chokable object within a toddler's reach. The rule must be inferred from world knowledge, and observations can appear to conflict.
- **Bedroom**: deliver bedtime medication. Hazard: a duplicate dose or wrong formulation. Evidence is spread across a directory, a plan, package labels and a care record, and each robot has only two camera moves, so the team must decide who reads what, and in which order.

Instances vary the hazard, the distractor objects and the private context so that no fixed visual pattern or default action gives the right answer.

### Where open deliberation breaks

With unstructured multi-round discussion, mean accuracy over five frontier VLMs (Claude Sonnet 4.6, GPT-5.6 luna, Gemini 3.5 Flash-Lite, Qwen3.8 27B, Grok 4.3) falls from 0.75 in the kitchen to 0.61 in the living room and 0.49 in the bedroom, close to chance. To see why, we audit every interaction trace with two LLM judges, validated against human annotators, and attribute each wrong decision to the earliest break in the evidence chain: **pooling** failures (never obtained, never shared, shared late) or **processing** failures (ignored, contested and lost, wrong reasoning). The dominant failure shifts by environment. In the kitchen a decisive fact is simply never shared in 62% of incorrect runs; in the bedroom the required reading is never obtained in 88% and arrives late in 87%. A full-information diagnostic, where every robot sees everything, lifts living-room accuracy to 88–100%, so the models can solve the task; what fails is moving evidence through the team. Prompting strategies, communication topologies, larger teams, more rounds and alternative aggregation rules do not consistently help.

### HUDDLE

HUDDLE borrows from human safety-critical teamwork (surgical checklists, crew resource management, the two-challenge rule) and turns it into a fixed, task-agnostic staged protocol:

1. **Grounding**: each robot asks targeted questions about what is ambiguous in its own view; teammates answer only when they hold the evidence.
2. **Share**: robots post their private facts first, then at most three safety-relevant observations. No votes yet, so evidence reaches the board before anyone commits.
3. **Assess**: each robot labels every task condition *satisfied*, *failed* or *unknown* from reported evidence only, and writes an ordered plan for resolving unknowns: who reads what, and what they need to know first.
4. **Discuss**: robots revise votes as evidence arrives. When robots can act, a camera move is announced with its purpose, reviewed by teammates, and only then carried out.
5. **Challenge** (optional safeguard): a robot that still votes for the conservative action after being challenged can stop the team.

The protocol never tells robots what the conditions or the evidence chain are; they infer those from the task.

### Results

HUDDLE with the safeguard improves mean accuracy for every model in every environment: by 3–18 points in the kitchen, 12–38 in the living room and 13–42 in the bedroom, where Sonnet 4.6 goes from 0.42 to 0.92. The targeted failures shrink accordingly: *never shared* drops from 0.62 to 0.05 in the kitchen, and in the bedroom *never obtained* falls from 0.88 to 0.37 and *ignored* from 0.38 to 0.04. Premature camera moves, which happened in every open-deliberation bedroom episode, fall to zero for one of the robots with Sonnet 4.6. What HUDDLE cannot fix is wrong evidence: decisions driven by hallucination or visual misperception persist at similar rates under both pipelines.
'''

