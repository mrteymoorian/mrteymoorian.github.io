[[items]]
id = "reasonbreak"
short = "ReasonBreak"
title = "ReasonBreak: Probing Vulnerabilities in Reasoning-Enabled Vision-Language-Action Models for Autonomous Driving"
venue = "arXiv preprint"
year = 2026
tags = ["Autonomous driving", "VLA models", "Adversarial robustness", "Reasoning"]
paper = "https://arxiv.org/abs/2605.29114"
summary = "A black-box evaluation framework and benchmark for reasoning-enabled driving VLAs, showing that small textual perturbations can rewrite a model's reasoning, bend its trajectory and degrade closed-loop safety. Collaboration with Qualcomm."

stats = [
  { value = "3", label = "reasoning-enabled driving VLAs" },
  { value = "100%", label = "peak open-loop reasoning ASR" },
  { value = "72%", label = "closed-loop trajectory ASR" },
  { value = "≈ 0.02", label = "correlation between reasoning drift and trajectory deviation" },
]

figures = [
  { src = "/projects/reasonbreak-pipeline.webp", width = 1140, height = 561, caption = "The ReasonBreak pipeline. A perturbed input is fed to the VLA. Reasoning is decomposed into object, relation, implication and planning and checked for semantic drift, token inflation (slowdown) or missing output (DoS); the trajectory is checked for excess deviation; successful attacks are then scored on downstream safety." },
  { src = "/projects/reasonbreak-correlation.webp", width = 393, height = 333, caption = "Alpamayo1, open loop: the four reasoning fields are strongly correlated with each other but almost uncorrelated with trajectory deviation (Δ min ADE)." },
  { src = "/projects/reasonbreak-latency.webp", width = 498, height = 393, caption = "Inference latency grows linearly with the number of reasoning tokens, so a slowdown attack is also a latency attack." },
  { src = "/projects/reasonbreak-safety.webp", width = 1212, height = 717, wide = true, caption = "Closed-loop safety impact of successful trajectory attacks. Off-diagonal cells are incidents introduced (red) or removed (green) by the perturbation relative to the benign rollout." },
]

content = '''
### The problem

Reasoning-enabled vision-language-action (VLA) models such as NVIDIA's Alpamayo family produce a short chain of reasoning and a driving trajectory from the same forward pass, on the assumption that the two are tightly coupled. Nobody had asked what happens to that coupling under input perturbation, and in driving a wrong output is not a task error but a safety violation. ReasonBreak is the first systematic study of reasoning as an attack surface in VLA-based autonomous driving.

### Framework

A reasoning-enabled VLA maps an input to a pair (reasoning, trajectory). We measure how a perturbed input changes each surface, how the two changes relate, and whether they lead to unsafe driving:

- **Semantic reasoning change.** An LLM evaluator, validated against other judges and human ratings, decomposes each reasoning string into *object*, *relation*, *implication* and *planning*, and scores the deviation of each field from the benign output.
- **Structural reasoning change.** *Slowdown*, where the perturbed reasoning is much longer than the benign one, and *denial of service*, where the model emits no reasoning at all.
- **Trajectory degradation.** Excess error over the benign run: ADE against ground truth in open loop, and the distance between the realized and reference ego position in closed loop.
- **Closed-loop success** is declared only when the excess deviation stays above threshold over a contiguous window, so simulator noise and nominal drift are not counted.
- **Safety impact** is scored separately for successful attacks: collision, near-encounter and minimum time-to-collision in open loop; collision, off-road and wrong-lane events in closed loop.

### Threat model

The adversary is query-based and black-box: no weights, gradients, logits or confidence scores, and no control over cameras or other sensors. It can only write to the textual input channel, the navigation instruction that may arrive from speech-to-text, an in-vehicle interface or a ride-sharing app, and we restrict it to semantics-preserving surface-form edits: capitalization changes, word scrambling and character noise. In open loop the attacker runs Best-of-N sampling against the target-specific success condition. In closed loop a single random perturbation is applied at every simulation step, so there is no search at all.

### Results

Evaluated on Alpamayo1 and Alpamayo1.5 (195 NVIDIA Physical AI scenes in open loop; 50 NuRec clips in AlpaSim in closed loop) and on AutoVLA (nuScenes mini_val):

- **Both surfaces are manipulable.** Open-loop semantic reasoning ASR reaches 0.76–0.89 on Alpamayo1 and 0.96–1.00 on AutoVLA, which also suffers a DoS ASR of 1.0 and a trajectory ASR of 0.91. Alpamayo1.5, which adds RL post-training, is more robust semantically (0.42–0.63) but more sensitive to slowdown.
- **Reasoning and action are only weakly coupled.** Reasoning drift and trajectory deviation are nearly uncorrelated (about 0.02 for Alpamayo1), while the four reasoning fields correlate at 0.7–0.96 with each other. Manipulated reasoning often leaves the trajectory untouched, and large trajectory deviations occur with little reasoning change.
- **Closed loop.** Trajectory manipulation is the most effective attack, with 72% ASR on Alpamayo1 and 48% on Alpamayo1.5; semantic reasoning attacks still reach 48–62% and 40–44%. Successful attacks introduce new collisions, off-road and wrong-lane events, and bring failures forward in time when the benign rollout was already unsafe.
- **Latency.** Reasoning length maps linearly to inference time, so slowdown attacks have a real-time cost.

The benchmark and dataset, mapping input conditions to reasoning outputs and safety outcomes, are released for evaluating future attacks and defenses.
'''

