[[items]]
id = "agent-leakage"
short = "Agent leakage"
title = "Network-Level Prompt and Trait Leakage in Local Research Agents"
venue = "USENIX Security"
year = 2026
tags = ["Privacy", "AI agents", "Traffic analysis", "Inference attacks"]
paper = "https://www.usenix.org/conference/usenixsecurity26/presentation/jeong"
code = "https://github.com/umass-aisec/wra"
summary = "Locally deployed web research agents visit 70–140 domains per prompt. We show that a passive network observer who sees only those domain names and their timing can reconstruct what the user asked and infer who they are, and we evaluate defenses."

stats = [
  { value = "70–140", label = "domains visited per request" },
  { value = "> 73%", label = "of functional and domain intent recovered" },
  { value = "19 / 32", label = "latent traits recovered after a week of sessions" },
  { value = "−29%", label = "average attack effectiveness under our defenses" },
]

figures = [
  { src = "/projects/wra-overview.webp", width = 1536, height = 1077, caption = "Overview. The user prompt is never visible, but the agent's domain sequence lets the observer reconstruct a functionally equivalent prompt and infer personal traits. Existing text-similarity metrics under-report this leakage; OBELS captures it." },
  { src = "/projects/wra-pipeline.webp", width = 744, height = 423, caption = "Two-stage attack. The adversary first builds an inference model from proxy prompts and their traces, then applies it to observed traces of real users." },
  { src = "/projects/wra-traits.webp", width = 744, height = 558, caption = "The fifteen traits most exposed by a week of agent browsing (mean similarity between inferred and true values across personas)." },
]

content = '''
### The problem

Web and research agents (WRAs) such as GPT Researcher, AutoGen or Browser-Use take a prompt, decompose it, search, visit dozens of sites and synthesize a report. Running them locally is often sold as the privacy-preserving option: no prompt leaves the machine. But the agent's browsing does. Unlike a human session, which touches a handful of sites at an irregular pace, a single agent run traverses 40–100 distinct domains in a dense, machine-paced burst, and we show that this traffic is separable from human browsing with 97.9% accuracy. DNS resolvers, ISPs, VPN providers and corporate firewalls all see it.

### Threat model and attacks

The adversary is strictly passive and sees only network metadata: domain names (from DNS or TLS SNI), their order, and coarse timing and payload sizes. No URLs, page contents, prompts or model internals. Two goals:

- **Prompt recovery**: reconstruct a prompt that is functionally equivalent to the user's from one session's trace.
- **Trait inference**: profile latent attributes (sex, religion, political views, income, health insurance, and so on) from several sessions linked over time.

Both follow the same two-stage pipeline. Offline, the adversary generates realistic proxy prompts, from TREC query sets or from synthetic personas with chosen traits, runs the agent on them to collect (trace, prompt) or (trace, traits) pairs, filters ad and tracker domains, and builds an inference model by in-context learning or fine-tuning. Online, the model is applied to a new trace.

### OBELS: measuring the leakage that matters

Sentence-embedding similarity and LLM-as-judge scores measure what prompts *say*, not what they make the agent *do*. "Compare Italy and Spain's digital nomad visas" and "How do work visas differ across southern Europe?" score low, yet drive the agent to the same portals. OBELS abstracts both prompts into (intent, source type, entity) triplets and scores four dimensions separately: functional equivalence, domain-type equivalence, semantic equivalence and entity-granularity tolerance.

### Results

- **Prompts leak.** With 5-shot in-context learning on GPT-Researcher traces, the attack recovers 77% of functional intent and 74% of domain type (OBELS) from domain names alone. In-context learning beats fine-tuning across five inference LLMs. Agents built on local backbones (DeepSeek, Mistral) leak slightly less than GPT-4-backed ones, but still enough.
- **Robust to weak visibility.** Accuracy holds when 40% of domains are hidden, and adding timing metadata brings no consistent gain: domain identity is the signal. URL-level visibility leaks more still.
- **Traits leak.** Over a simulated week of seven sessions, the adversary infers health insurance (0.98), veteran status (0.90), employment status (0.88) and household language (0.86) with near-perfect accuracy; sex, race, religion and political views score 0.70–0.77. Seven sessions reveal 12–14 high-confidence traits per persona, up to 19 of 32, and traits never mentioned in the prompts are still inferred at moderate accuracy.
- **Utility does not need this.** Report quality stays flat down to 10% domain visibility, so most of the extra domains an agent visits add exposure without adding value.

### Defenses

Two families: **hiding** and **blocking**. Hiding runs LLM-generated decoy prompts in parallel with the real one, optionally steered by a virtual persona that conflicts with the user's estimated traits. Five decoys cut LLM-judge prompt-recovery accuracy from 0.415 to 0.175 and functional OBELS from 0.77 to 0.57; trait-conflicting personas reduce occupational trait inference by 24%. Blocking redirects tasks to multipurpose sources (Wikipedia, StackExchange) or the model's own knowledge so that unique domains are never contacted. Across settings the defenses reduce attack effectiveness by 29% on average with negligible utility loss, but residual leakage remains; only full network-level protection closes the channel.
'''

