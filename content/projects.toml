[[items]]
id = "meansparse"
short = "MeanSparse"
title = "MeanSparse: Post-Training Robustness Enhancement Through Mean-Centered Feature Sparsification"
venue = "arXiv preprint"
year = 2024
tags = ["Adversarial robustness", "Computer vision", "Post-training"]
paper = "https://arxiv.org/abs/2406.05927"
code = "https://github.com/SPIN-UMass/MeanSparse"
summary = "A post-training operator that zeroes out small variations around each feature channel's mean. Applied to the top RobustBench models, it set new AutoAttack records on CIFAR-10, CIFAR-100 and ImageNet with no retraining and no measurable change in clean accuracy."

stats = [
  { value = "75.28%", label = "CIFAR-10 AutoAttack accuracy (from 73.71%)" },
  { value = "62.12%", label = "ImageNet AutoAttack accuracy (from 59.56%)" },
  { value = "44.78%", label = "CIFAR-100 AutoAttack accuracy (from 42.67%)" },
  { value = "1 pass", label = "over the training set to calibrate" },
]

figures = [
  { src = "/projects/meansparse-operator.webp", width = 1260, height = 822, caption = "The operator. Left: per-channel mean and standard deviation from the training set define a dead zone of width 2ασ around the mean. Middle and right: features inside the zone are snapped to the mean; everything else passes through unchanged." },
  { src = "/projects/meansparse-results.webp", width = 1086, height = 1077, caption = "Clean vs. AutoAttack accuracy before and after MeanSparse for the leading RobustBench models on CIFAR-10 (ℓ∞ and ℓ2), ImageNet and CIFAR-100." },
]

content = '''
### The idea

Adversarial training weakens non-robust features but does not remove them: they survive as small variations in the feature maps. The most probable region of a feature's distribution, the neighbourhood of its mean, is also the least informative one, so blocking that neighbourhood should cost the model little while taking away capacity the attacker relies on.

### The operator

For each channel we compute the mean µ and standard deviation σ over the training set in a single forward pass. At inference, a value within µ ± ασ is replaced by µ; anything outside passes through unchanged. The rule falls out of the proximal operator of an ℓ0 penalty on mean-centered features, so it has a clean optimization interpretation, and scaling the threshold by σ means a single α works for every layer. We tried training with the operator in the loop, but the dead zone zeroes gradients exactly where most features live and training becomes unstable. The post-training recipe (freeze the weights, insert the operator before every activation, calibrate the statistics, sweep α) is what makes it practical for large models.

### Results

Applied to the top entries of RobustBench, MeanSparse raised ℓ∞ AutoAttack accuracy from 73.71% to 75.28% on CIFAR-10 (WideResNet-94-16), from 42.67% to 44.78% on CIFAR-100 and from 59.56% to 62.12% on ImageNet (Swin-L), and ℓ2 accuracy on CIFAR-10 from 84.97% to 87.28%, taking the first rank in all four settings at the time of release. Clean accuracy changes by at most 0.3 points, and by less than 0.1 on the record-setting models. An α around 0.2–0.25 is the sweet spot across architectures; larger values start eating into clean accuracy. Calibration takes 102 seconds on CIFAR-10 and about 90–100 minutes on ImageNet-1k, and evaluation time grows by 2–3%.

### Beyond gradient-based attacks

The operator is piecewise constant, so we checked that the gain is not an artifact of gradient masking. The improvement holds across activation functions (ReLU, GELU, PSSiLU and others) on a ResNet-18 and under the gradient-free Square attack, and the paper also evaluates an adaptive PGD variant that explicitly penalizes perturbations the operator would absorb.
'''
