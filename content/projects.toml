[[items]]
id = "vidstamp"
short = "VidStamp"
title = "VidStamp: A Temporally-Aware Watermark for Ownership and Integrity in Video Diffusion Models"
venue = "arXiv preprint"
year = 2025
tags = ["Watermarking", "Video diffusion", "Provenance", "Content integrity"]
paper = "https://arxiv.org/abs/2505.01406"
code = "https://github.com/SPIN-UMass/VidStamp"
summary = "A watermark embedded by the decoder of a latent video diffusion model itself, giving every frame its own 48-bit message at zero inference cost, so a video can prove its origin and reveal exactly where it was tampered with."

stats = [
  { value = "48 bits", label = "per frame, embedded during generation" },
  { value = "768 bits", label = "per 16-frame SVD video (VideoSeal: 96)" },
  { value = "−166.65", label = "log P-value, strongest of all baselines" },
  { value = "0.96", label = "frame-level tamper localization accuracy" },
]

figures = [
  { src = "/projects/vidstamp-pipeline.webp", width = 1290, height = 372, caption = "Training pipeline. Only the temporally aware decoder is fine-tuned; a frozen HiDDeN extractor supervises per-frame message recovery (BCE loss) while a Watson-VGG loss preserves perceptual quality. In dynamic mode a latent message adder injects a control sequence that selects a message template per frame." },
  { src = "/projects/vidstamp-threat.webp", width = 648, height = 474, caption = "Threat model. The model owner watermarks during generation; a third party verifies ownership and user keys, and an operator detects frame-level manipulation, all with the public extractor." },
  { src = "/projects/vidstamp-robustness.webp", width = 618, height = 585, caption = "Bit accuracy under 11 common distortions on Stable Video Diffusion, against VideoShield, VideoSeal and RivaGAN. The LDPC variant trades capacity for extra robustness." },
]

content = '''
### The problem

Post-hoc video watermarks add a neural pass per video, which is a real cost at production scale and a blocker for streaming generation. Existing in-generation methods have low capacity or hurt quality. And treating a watermark as a yes/no detector wastes it: a video has many frames, each of which could carry its own message, which would turn the watermark into a channel for metadata *and* a frame-level integrity check.

### Method

VidStamp follows Stable Signature's idea of fine-tuning the latent decoder, but exploits the 3D convolutions and temporal attention of video decoders so that each frame can carry a distinct message consistently:

- **Supervision.** A pretrained HiDDeN extractor stays frozen and decodes each frame; a BCE message loss is combined with a Watson-VGG perceptual loss. Only the decoder is updated.
- **Two-stage fine-tuning.** Stage one trains on COCO images treated as pseudo-videos, which teaches spatial message separation. Stage two fine-tunes on videos generated by the same diffusion model to restore temporal consistency. The second stage matters: clean bit accuracy rises from 0.70 to 0.98.
- **Static and dynamic modes.** In static mode the message sequence is baked into the decoder. In dynamic mode a lightweight latent message adder injects an index sequence at inference time, so templates can be selected per frame without retraining, creating a second communication channel.
- **Error correction.** Part of the 48-bit budget can hold an LDPC code (16 data + 32 parity bits), raising word accuracy to 0.95 or more under several distortions.
- **Tamper localization.** Each extracted message is matched to the reference keys by Hamming similarity; frames below threshold are flagged as inserted, and the aligned order exposes drops and swaps.

### Results

On Stable Video Diffusion (image-to-video), OpenSora and Wan (text-to-video), VidStamp reaches bit accuracies of 0.95, 0.98 and 0.93 while embedding 48 bits per frame. On SVD that is 768 bits per video, versus 512 for VideoShield, 96 for VideoSeal and 32 for RivaGAN; its log P-value of −166.65 is the lowest (strongest) of all methods, and its VBench quality score (0.836) is indistinguishable from the unwatermarked model (0.838). Under 11 distortions it has the best overall log P, and in tamper localization it averages 0.96 across frame swaps, insertions and drops against 0.936 for VideoShield, with over 95% accuracy under combined attacks.
'''

